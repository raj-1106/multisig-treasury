name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: forge install OpenZeppelin/openzeppelin-contracts@v5.0.2 --no-git

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv